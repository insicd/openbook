ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Docker uses externally managed configuration and the CLI installation flow.
    <LocationMatch "^/(?:index\.php/)?install(?:/|$)">
        Require all denied
    </LocationMatch>
    # Uploaded files must never execute as PHP (including PATH_INFO requests).
    <DirectoryMatch "^/var/www/html/(public/storage|storage/app/public)(/|$)">
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    <LocationMatch "(?i)^/storage/.*\.(php[0-9]*|phtml|phar)([/.]|$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
