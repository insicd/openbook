apiVersion: v1
kind: Service
metadata:
  name: {{ include "openbook.name" . }}
  labels:
    {{- include "openbook.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbook
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
